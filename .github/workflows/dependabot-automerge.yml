# Dependabot auto-merge -- life's too short to click "merge" on patch bumps.
name: Dependabot Auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge
    runs-on: ubuntu-24.04
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch and minor updates -- majors need a human
      - name: Auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        shell: bash
        run: |
          AUTO_MERGE_ALLOWED=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')
          case "$AUTO_MERGE_ALLOWED" in
            true) gh pr merge --auto --squash "$PR_URL" ;;
            false) echo "Auto-merge is disabled for this repository; leaving the PR for review." ;;
            *) echo "Unable to determine repository auto-merge setting." >&2; exit 1 ;;
          esac
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
